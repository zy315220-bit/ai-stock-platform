name: Corporate Actions CI

on:
  push:
    branches:
      - agent/real-stock-analysis-v1
    paths:
      - 'backend/stock.py'
      - 'backend/corporate_actions.py'
      - 'backend/app/services/backtest/**'
      - 'backend/tests/test_corporate_actions.py'
      - 'backend/tests/test_stock_price_basis.py'
      - '.github/workflows/corporate-actions-ci.yml'
  pull_request:
    paths:
      - 'backend/stock.py'
      - 'backend/corporate_actions.py'
      - 'backend/app/services/backtest/**'
      - 'backend/tests/test_corporate_actions.py'
      - 'backend/tests/test_stock_price_basis.py'

jobs:
  split-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run corporate-action regression suite
        run: python -m unittest tests.test_corporate_actions tests.test_stock_price_basis -v
