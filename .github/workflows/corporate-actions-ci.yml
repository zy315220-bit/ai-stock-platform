name: Research Integrity CI

on:
  push:
    branches:
      - agent/real-stock-analysis-v1
    paths:
      - 'backend/stock.py'
      - 'backend/corporate_actions.py'
      - 'backend/indicators.py'
      - 'backend/score_engine/**'
      - 'backend/app/services/backtest/**'
      - 'backend/app/services/corporate_action_ledger.py'
      - 'backend/app/services/corporate_action_metadata.py'
      - 'backend/app/services/corporate_action_ingestion.py'
      - 'backend/app/services/taiwan_official_ca_mapper.py'
      - 'backend/app/services/competition_dataset_guard.py'
      - 'backend/tests/test_corporate_actions.py'
      - 'backend/tests/test_corporate_action_ledger.py'
      - 'backend/tests/test_corporate_action_adapter.py'
      - 'backend/tests/test_corporate_action_ingestion.py'
      - 'backend/tests/test_taiwan_official_ca_mapper.py'
      - 'backend/tests/test_stock_price_basis.py'
      - 'backend/tests/test_backtest_no_lookahead.py'
      - 'backend/tests/test_production_split_pipeline.py'
      - 'backend/requirements.txt'
      - '.github/workflows/corporate-actions-ci.yml'
  pull_request:
    paths:
      - 'backend/stock.py'
      - 'backend/corporate_actions.py'
      - 'backend/indicators.py'
      - 'backend/score_engine/**'
      - 'backend/app/services/backtest/**'
      - 'backend/app/services/corporate_action_ledger.py'
      - 'backend/app/services/corporate_action_metadata.py'
      - 'backend/app/services/corporate_action_ingestion.py'
      - 'backend/app/services/taiwan_official_ca_mapper.py'
      - 'backend/app/services/competition_dataset_guard.py'
      - 'backend/tests/test_corporate_actions.py'
      - 'backend/tests/test_corporate_action_ledger.py'
      - 'backend/tests/test_corporate_action_adapter.py'
      - 'backend/tests/test_corporate_action_ingestion.py'
      - 'backend/tests/test_taiwan_official_ca_mapper.py'
      - 'backend/tests/test_stock_price_basis.py'
      - 'backend/tests/test_backtest_no_lookahead.py'
      - 'backend/tests/test_production_split_pipeline.py'
      - 'backend/requirements.txt'
      - '.github/workflows/corporate-actions-ci.yml'

jobs:
  research-integrity-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run legacy research-integrity regression suite
        run: python -m unittest tests.test_corporate_actions tests.test_stock_price_basis tests.test_backtest_no_lookahead tests.test_production_split_pipeline -v
      - name: Run corporate-action integrity gates
        run: python -m pytest tests/test_corporate_action_ledger.py tests/test_corporate_action_adapter.py tests/test_corporate_action_ingestion.py tests/test_taiwan_official_ca_mapper.py -v
