name: Daily Autonomous Research
run-name: "Daily Autonomous Research · ${{ github.event_name }} · #${{ github.run_number }}"

on:
  # One controlled push trigger is retained only for this workflow file so a
  # research-lifecycle change can be end-to-end verified. Normal research code
  # pushes do not launch the expensive 20-symbol matrix.
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/daily-autoresearch.yml"
  schedule:
    # 06:30 and 18:30 Asia/Taipei every day.
    - cron: "30 22,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-autonomous-research-v2
  cancel-in-progress: false

jobs:
  research-shards:
    name: Research ${{ matrix.stock }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        stock:
          - "0050"
          - "0056"
          - "00878"
          - "00919"
          - "2330"
          - "2317"
          - "2454"
          - "2308"
          - "2382"
          - "2303"
          - "2345"
          - "2379"
          - "2881"
          - "2882"
          - "2891"
          - "2603"
          - "2615"
          - "3037"
          - "3231"
          - "3711"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check out prior train-only memory
        uses: actions/checkout@v4
        with:
          ref: research-data
          path: research-data
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Resolve Taiwan research date
        id: research-date
        run: echo "value=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
      - name: Run unattended research shard
        run: >-
          python -m scripts.run_daily_autoresearch
          --stock-code "${{ matrix.stock }}"
          --as-of-date "${{ steps.research-date.outputs.value }}"
          --max-experiments 64
          --attempts 2
          --retry-delay-seconds 20
          --prior-memory "../research-data/daily/memory/${{ matrix.stock }}.json"
          --output "research_artifacts/daily/${{ matrix.stock }}.json"
      - name: Upload auditable shard
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-${{ matrix.stock }}
          path: backend/research_artifacts/daily/${{ matrix.stock }}.json
          if-no-files-found: error
          retention-days: 21

  publish-snapshot:
    name: Publish fail-closed snapshot
    needs: research-shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Download all completed shards
        uses: actions/download-artifact@v4
        with:
          pattern: daily-research-*
          path: backend/research_artifacts/daily
          merge-multiple: true
      - name: Resolve Taiwan research date
        id: research-date
        run: echo "value=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
      - name: Aggregate only a complete, holdout-safe universe
        run: >-
          cd backend && python -m scripts.aggregate_daily_autoresearch
          --input-dir research_artifacts/daily
          --output research_artifacts/published/daily/latest.json
          --memory-output-dir research_artifacts/published/daily/memory
          --as-of-date "${{ steps.research-date.outputs.value }}"
      - name: Summarize cross-universe model-selection evidence
        run: >-
          cd backend && python -m scripts.summarize_model_selection_evidence
          --input-dir research_artifacts/daily
          --output research_artifacts/published/daily/model-selection-evidence.json
      - name: Summarize promotion gate bottlenecks
        run: >-
          cd backend && python -m scripts.summarize_gate_bottlenecks
          --input-dir research_artifacts/daily
          --output research_artifacts/published/daily/gate-bottlenecks.json
      - name: Check out durable research-data branch
        uses: actions/checkout@v4
        with:
          ref: research-data
          path: research-data
          fetch-depth: 1
      - name: Open final holdout only for fully promoted candidates
        run: >-
          cd backend && python -m scripts.run_final_holdout_gate
          --input-dir research_artifacts/daily
          --ledger-root ../research-data/holdout-ledger
          --summary-output research_artifacts/published/daily/final-holdout-evaluations.json
          --certified-output research_artifacts/published/daily/certified-robots.json
      - name: Audit complete autonomous research lifecycle
        run: >-
          cd backend && python -m scripts.audit_research_system
          --snapshot research_artifacts/published/daily/latest.json
          --model-selection research_artifacts/published/daily/model-selection-evidence.json
          --bottlenecks research_artifacts/published/daily/gate-bottlenecks.json
          --final-holdout research_artifacts/published/daily/final-holdout-evaluations.json
          --output research_artifacts/published/daily/research-system-audit.json
      - name: Upload immutable daily snapshot
        uses: actions/upload-artifact@v4
        with:
          name: daily-autoresearch-${{ steps.research-date.outputs.value }}
          path: |
            backend/research_artifacts/published/daily/latest.json
            backend/research_artifacts/published/daily/model-selection-evidence.json
            backend/research_artifacts/published/daily/gate-bottlenecks.json
            backend/research_artifacts/published/daily/final-holdout-evaluations.json
            backend/research_artifacts/published/daily/certified-robots.json
            backend/research_artifacts/published/daily/research-system-audit.json
            backend/research_artifacts/published/daily/memory/*.json
          if-no-files-found: error
          retention-days: 21
      - name: Publish latest, diagnostics, certified robots, per-run audit, and durable memory
        env:
          RESEARCH_DATE: ${{ steps.research-date.outputs.value }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p research-data/daily/history
          mkdir -p research-data/daily/memory
          mkdir -p research-data/daily/diagnostics
          mkdir -p "research-data/daily/runs/${RESEARCH_DATE}/${RUN_ID}"
          cp backend/research_artifacts/published/daily/latest.json research-data/daily/latest.json
          cp backend/research_artifacts/published/daily/latest.json "research-data/daily/history/${RESEARCH_DATE}.json"
          cp backend/research_artifacts/published/daily/model-selection-evidence.json research-data/daily/diagnostics/model-selection-evidence.json
          cp backend/research_artifacts/published/daily/gate-bottlenecks.json research-data/daily/diagnostics/gate-bottlenecks.json
          cp backend/research_artifacts/published/daily/final-holdout-evaluations.json research-data/daily/diagnostics/final-holdout-evaluations.json
          cp backend/research_artifacts/published/daily/research-system-audit.json research-data/daily/diagnostics/research-system-audit.json
          cp backend/research_artifacts/published/daily/certified-robots.json research-data/certified-robots.json
          cp backend/research_artifacts/published/daily/memory/*.json research-data/daily/memory/
          cp backend/research_artifacts/published/daily/latest.json "research-data/daily/runs/${RESEARCH_DATE}/${RUN_ID}/latest.json"
          cp backend/research_artifacts/published/daily/model-selection-evidence.json "research-data/daily/runs/${RESEARCH_DATE}/${RUN_ID}/model-selection-evidence.json"
          cp backend/research_artifacts/published/daily/gate-bottlenecks.json "research-data/daily/runs/${RESEARCH_DATE}/${RUN_ID}/gate-bottlenecks.json"
          cp backend/research_artifacts/published/daily/final-holdout-evaluations.json "research-data/daily/runs/${RESEARCH_DATE}/${RUN_ID}/final-holdout-evaluations.json"
          cp backend/research_artifacts/published/daily/certified-robots.json "research-data/daily/runs/${RESEARCH_DATE}/${RUN_ID}/certified-robots.json"
          cp backend/research_artifacts/published/daily/research-system-audit.json "research-data/daily/runs/${RESEARCH_DATE}/${RUN_ID}/research-system-audit.json"
          git -C research-data config user.name "ai-stock-research-bot"
          git -C research-data config user.email "actions@users.noreply.github.com"
          git -C research-data add certified-robots.json daily/latest.json "daily/history/${RESEARCH_DATE}.json" daily/diagnostics daily/memory "daily/runs/${RESEARCH_DATE}/${RUN_ID}"
          if [ -d research-data/holdout-ledger ]; then
            git -C research-data add holdout-ledger
          fi
          if git -C research-data diff --cached --quiet; then
            echo "Data fingerprints are unchanged; no duplicate snapshot commit needed."
            exit 0
          fi
          git -C research-data commit -m "research: publish ${RESEARCH_DATE} autonomous results run ${RUN_ID}"
          git -C research-data push origin HEAD:research-data
