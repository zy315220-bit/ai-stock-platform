name: Daily Autonomous Research
run-name: "Daily Autonomous Research · ${{ github.event_name }} · #${{ github.run_number }}"

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/daily-autoresearch.yml"
      - "backend/app/api/research_lab.py"
      - "backend/app/services/backtest/**"
      - "backend/app/services/research_lab/**"
      - "backend/scripts/run_daily_autoresearch.py"
      - "backend/scripts/aggregate_daily_autoresearch.py"
    # This also bootstraps the first run after the workflow is active on main.
    # Production continuation acceptance reruns after the first memory snapshot.
  schedule:
    # Taiwan has no DST: 10:30 UTC is 18:30 Asia/Taipei.
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-autonomous-research-v2
  cancel-in-progress: false

jobs:
  research-shards:
    name: Research ${{ matrix.stock }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        stock:
          - "0050"
          - "0056"
          - "00878"
          - "00919"
          - "2330"
          - "2317"
          - "2454"
          - "2308"
          - "2382"
          - "2303"
          - "2345"
          - "2379"
          - "2881"
          - "2882"
          - "2891"
          - "2603"
          - "2615"
          - "3037"
          - "3231"
          - "3711"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check out prior train-only memory
        uses: actions/checkout@v4
        with:
          ref: research-data
          path: research-data
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Resolve Taiwan research date
        id: research-date
        run: echo "value=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
      - name: Run unattended research shard
        run: >-
          python -m scripts.run_daily_autoresearch
          --stock-code "${{ matrix.stock }}"
          --as-of-date "${{ steps.research-date.outputs.value }}"
          --max-experiments 24
          --attempts 2
          --retry-delay-seconds 20
          --prior-memory "../research-data/daily/memory/${{ matrix.stock }}.json"
          --output "research_artifacts/daily/${{ matrix.stock }}.json"
      - name: Upload auditable shard
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-${{ matrix.stock }}
          path: backend/research_artifacts/daily/${{ matrix.stock }}.json
          if-no-files-found: error
          retention-days: 90

  publish-snapshot:
    name: Publish fail-closed snapshot
    needs: research-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Download all completed shards
        uses: actions/download-artifact@v4
        with:
          pattern: daily-research-*
          path: backend/research_artifacts/daily
          merge-multiple: true
      - name: Resolve Taiwan research date
        id: research-date
        run: echo "value=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
      - name: Aggregate only a complete, holdout-safe universe
        run: >-
          cd backend && python -m scripts.aggregate_daily_autoresearch
          --input-dir research_artifacts/daily
          --output research_artifacts/published/daily/latest.json
          --memory-output-dir research_artifacts/published/daily/memory
          --as-of-date "${{ steps.research-date.outputs.value }}"
      - name: Upload immutable daily snapshot
        uses: actions/upload-artifact@v4
        with:
          name: daily-autoresearch-${{ steps.research-date.outputs.value }}
          path: |
            backend/research_artifacts/published/daily/latest.json
            backend/research_artifacts/published/daily/memory/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Check out durable research-data branch
        uses: actions/checkout@v4
        with:
          ref: research-data
          path: research-data
          fetch-depth: 1
      - name: Publish latest and dated history
        env:
          RESEARCH_DATE: ${{ steps.research-date.outputs.value }}
        run: |
          mkdir -p research-data/daily/history
          mkdir -p research-data/daily/memory
          cp backend/research_artifacts/published/daily/latest.json research-data/daily/latest.json
          cp backend/research_artifacts/published/daily/latest.json "research-data/daily/history/${RESEARCH_DATE}.json"
          cp backend/research_artifacts/published/daily/memory/*.json research-data/daily/memory/
          git -C research-data config user.name "ai-stock-research-bot"
          git -C research-data config user.email "actions@users.noreply.github.com"
          git -C research-data add daily/latest.json "daily/history/${RESEARCH_DATE}.json" daily/memory
          if git -C research-data diff --cached --quiet; then
            echo "Data fingerprints are unchanged; no duplicate snapshot commit needed."
            exit 0
          fi
          git -C research-data commit -m "research: publish ${RESEARCH_DATE} autonomous results"
          git -C research-data push origin HEAD:research-data
