name: Preserve Research Incumbent
run-name: "Preserve Research Incumbent · ${{ github.event_name }}"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/manual-incumbent-trigger"
  workflow_run:
    workflows:
      - Daily Autonomous Research
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: preserve-research-incumbent
  cancel-in-progress: false

jobs:
  preserve-incumbent:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Check out durable research data
        uses: actions/checkout@v6
        with:
          ref: research-data
          path: research-data
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Preserve strongest same-campaign incumbent
        run: >-
          cd backend && python -m scripts.preserve_research_incumbent
          --snapshot ../research-data/daily/latest.json
          --runs-root ../research-data/daily/runs
          --incumbent ../research-data/daily/incumbent.json

      - name: Mirror incumbent-aware daily history
        run: |
          RESEARCH_DATE=$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('research-data/daily/latest.json').read_text())
          print(payload['as_of_date'])
          PY
          )
          mkdir -p research-data/daily/history
          cp research-data/daily/latest.json "research-data/daily/history/${RESEARCH_DATE}.json"

      - name: Persist incumbent and compatibility snapshot
        run: |
          git -C research-data config user.name "ai-stock-research-bot"
          git -C research-data config user.email "actions@users.noreply.github.com"
          git -C research-data add daily/latest.json daily/incumbent.json daily/history
          if git -C research-data diff --cached --quiet; then
            echo "Incumbent unchanged; nothing to publish."
          else
            git -C research-data commit -m "research: preserve same-campaign incumbent"
            git -C research-data push origin HEAD:research-data
          fi
