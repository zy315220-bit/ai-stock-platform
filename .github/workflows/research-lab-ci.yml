name: Research Lab CI

on:
  pull_request:
    paths:
      - "backend/app/services/research_lab/**"
      - "backend/app/services/research_universe.py"
      - "backend/app/api/research_lab.py"
      - "backend/app/main.py"
      - "backend/app/services/backtest/**"
      - "backend/scripts/run_research_lab_audit.py"
      - "backend/scripts/run_daily_autoresearch.py"
      - "backend/scripts/aggregate_daily_autoresearch.py"
      - "backend/scripts/build_competition_challengers.py"
      - "backend/scripts/run_competition_challengers.py"
      - "backend/scripts/summarize_model_selection_evidence.py"
      - "backend/scripts/summarize_gate_bottlenecks.py"
      - "backend/scripts/run_final_holdout_gate.py"
      - "backend/scripts/audit_research_system.py"
      - "backend/tests/test_research_lab*.py"
      - "backend/tests/test_backtest_no_lookahead.py"
      - "backend/tests/test_production_split_pipeline.py"
      - "frontend/app/research-lab/**"
      - "frontend/app/api/research-lab/**"
      - "frontend/components/ResearchLabPanel.tsx"
      - "frontend/components/DailyResearchStatus.tsx"
      - "frontend/components/Dashboard.tsx"
      - ".github/workflows/daily-autoresearch.yml"
      - ".github/workflows/research-lab-ci.yml"
  push:
    branches: ["main", "feature/ai-research-lab"]
    paths:
      - "backend/app/services/research_lab/**"
      - "backend/app/services/research_universe.py"
      - "backend/app/api/research_lab.py"
      - "backend/app/main.py"
      - "backend/app/services/backtest/**"
      - "backend/scripts/run_research_lab_audit.py"
      - "backend/scripts/run_daily_autoresearch.py"
      - "backend/scripts/aggregate_daily_autoresearch.py"
      - "backend/scripts/build_competition_challengers.py"
      - "backend/scripts/run_competition_challengers.py"
      - "backend/scripts/summarize_model_selection_evidence.py"
      - "backend/scripts/summarize_gate_bottlenecks.py"
      - "backend/scripts/run_final_holdout_gate.py"
      - "backend/scripts/audit_research_system.py"
      - "backend/tests/test_research_lab*.py"
      - "backend/tests/test_backtest_no_lookahead.py"
      - "backend/tests/test_production_split_pipeline.py"
      - "frontend/app/research-lab/**"
      - "frontend/app/api/research-lab/**"
      - "frontend/components/ResearchLabPanel.tsx"
      - "frontend/components/DailyResearchStatus.tsx"
      - "frontend/components/Dashboard.tsx"
      - ".github/workflows/daily-autoresearch.yml"
      - ".github/workflows/research-lab-ci.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Run research integrity and execution tests
        run: >-
          python -m pytest -q
          tests/test_research_lab*.py
          tests/test_backtest_no_lookahead.py
          tests/test_production_split_pipeline.py

  real-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run auditable 2330 research session
        run: python -m scripts.run_research_lab_audit
      - name: Upload research audit
        uses: actions/upload-artifact@v6
        with:
          name: research-lab-2330-audit
          path: backend/research_artifacts/research_lab_2330_latest.json
          if-no-files-found: error
          retention-days: 30

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  continuity-audit:
    name: Real-data continuity ${{ matrix.stock }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stock: ["3037", "0056"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Load durable Train-only memory
        uses: actions/checkout@v6
        with:
          ref: research-data
          path: research-data
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Verify real-data search resumes without opening Final Holdout
        env:
          RESEARCH_STOCK: ${{ matrix.stock }}
        run: |
          python -m scripts.run_daily_autoresearch \
            --stock-code "$RESEARCH_STOCK" --as-of-date "$(TZ=Asia/Taipei date +%F)" \
            --max-experiments 64 --attempts 2 --retry-delay-seconds 10 \
            --prior-memory "../research-data/daily/memory/${RESEARCH_STOCK}.json" \
            --output "research_artifacts/continuity/${RESEARCH_STOCK}.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('research_artifacts/continuity') / (os.environ['RESEARCH_STOCK'] + '.json')
          payload = json.loads(path.read_text())
          assert payload['result']['experiments_run'] > 0, 'Search still produced zero experiments'
          assert payload['result']['promotion_eligibility']['holdout_opened'] is False
          assert payload['training_memory']['provenance'] == 'TRAIN_ONLY'
          assert payload['training_memory']['validation_feedback_used'] is False
          assert payload['training_memory']['holdout_feedback_used'] is False
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: research-continuity-${{ matrix.stock }}
          path: backend/research_artifacts/continuity/*.json
          if-no-files-found: warn
          retention-days: 21
