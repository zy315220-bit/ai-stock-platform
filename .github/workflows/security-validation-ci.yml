name: Security and statistical validation

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/security-validation-ci.yml"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/security-validation-ci.yml"
      - ".gitignore"

permissions:
  contents: read

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Reject tracked local environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "Tracked secret-bearing environment files are forbidden:"
            echo "$tracked"
            exit 1
          fi

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Audit known Python vulnerabilities
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
          python -m pip_audit -r requirements.txt --progress-spinner off

  external-spa-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-validation.txt
      - name: Install production and validation dependencies
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Cross-check Hansen SPA against independent implementation
        working-directory: backend
        run: pytest -q tests/test_hansen_spa_external_reference.py
