name: TBB competition quality gate

on:
  push:
    branches:
      - competition/tbb-2026-smart-wealth
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/tbb-competition-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/tbb-competition-ci.yml"

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Production build
        working-directory: frontend
        run: npm run build

  tbb-backend-security:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Reject tracked secrets
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "$tracked"
            exit 1
          fi
      - name: TBB security and suitability tests
        working-directory: backend
        run: pytest -q tests/test_tbb_wealth.py tests/test_research_lab_final_holdout.py tests/test_research_lab_point_in_time.py